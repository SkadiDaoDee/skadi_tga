<!DOCTYPE html>
<!-- 上面这行告诉浏览器：这是一个 HTML5 网页 -->
<html lang="zh-CN">
<!-- lang="zh-CN" 表示页面语言是简体中文 -->

<head>
  <!-- head 里放的是“给浏览器看”的信息，不直接显示在页面上 -->
  <meta charset="UTF-8">
  <!-- 字符编码，保证中文不乱码 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 让手机浏览时按屏幕宽度缩放 -->
  <title>我的年度记录</title>
  <!-- 浏览器标签页上显示的标题 -->
  <link rel="stylesheet" href="style.css">
  <!-- 引入我们刚才写的公共样式文件 -->
</head>

<body>
<!-- body 里才是用户真正看到的内容 -->

<header>
  <!-- 页面顶部标题区 -->
  <h1>我的年度记录</h1>
  <p>游戏 · 动漫 · 影视 · 书籍 · 年度颁奖</p>
</header>

<nav class="nav">
  <!-- nav 是导航栏，class="nav" 对应 style.css 里的 .nav 样式 -->
  <a href="index.html" class="active">首页</a>
  <!-- class="active" 表示当前在首页，导航按钮会高亮 -->
  <a href="games.html">游戏</a>
  <a href="anime.html">动漫</a>
  <a href="movies.html">影视</a>
  <a href="books.html">书籍</a>
  <a href="awards.html">年度颁奖</a>
</nav>

<div class="home-intro">
  <!-- 首页的自我介绍，你以后可以改这里的文字 -->
  <p>这里记录我玩过的游戏、看过的动漫和影视、读过的书，以及每年的个人颁奖。</p>
</div>

<div class="cat-links">
  <!-- 五个分类入口大按钮，点击跳到对应页面 -->
  <a href="games.html">🎮<br>游戏</a>
  <a href="anime.html">📺<br>动漫</a>
  <a href="movies.html">🎬<br>影视</a>
  <a href="books.html">📚<br>书籍</a>
  <a href="awards.html">🏆<br>年度颁奖</a>
</div>

<footer>持续更新中</footer>
<!-- 页脚 -->

</body>
</html>
