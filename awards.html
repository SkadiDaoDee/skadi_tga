<h2>我的年度颁奖</h2>
<div id="award-list"></div>
<!-- 颁奖卡片会塞进这个容器 -->

<footer>持续更新中</footer>

<script src="data.js"></script>
<script>
  const container = document.getElementById('award-list');

  if (awards.length === 0) {
    // 这里用 awards 数组
    container.innerHTML = '<div class="empty-tip">年度颁奖尚未公布。</div>';
  } else {
    awards.forEach(item => {
      // 颁奖卡片的结构和作品卡片不同，用的是 .award-card 样式
      container.innerHTML += `
        <div class="award-card">
          <div class="award-year">${item.year} 年度</div>
          <div class="award-cat">${item.category}</div>
          <div class="award-winner">🏅 ${item.winner}</div>
          <div class="award-reason">${item.reason}</div>
        </div>`;
    });
  }
</script>

</body>
</html>
